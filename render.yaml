# Servidor da Pescaria ao Vivo no Render (plano gratis)
services:
  - type: web
    name: pescaria-servidor
    runtime: node
    plan: free
    rootDir: servidor
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /status
    envVars:
      - key: EULER_API_KEY
        sync: false
