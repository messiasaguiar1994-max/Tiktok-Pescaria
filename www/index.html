<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pescaria ao Vivo</title>
<style>
:root{--bg:#2b1a3a;--pn:rgba(35,18,48,.66);--ac:#ffb347;--tx:#fff4e6}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
canvas{display:block}#st{position:fixed;left:50%;top:50%;width:405px;height:720px;overflow:hidden;transform-origin:center center;background:#000}
.p{position:fixed;border:2px solid transparent;background:linear-gradient(160deg,#1c0e44,#0a0520) padding-box,linear-gradient(100deg,#27d3ff,#8a4dff 50%,#ff3fa4) border-box;border-radius:14px;padding:6px 9px;font-size:11px;line-height:1.4;box-shadow:0 0 10px rgba(60,170,255,.5),0 0 16px rgba(255,60,170,.35);backdrop-filter:blur(6px)}
.p h4{margin:0 0 3px;font-size:12px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,#42e0ff,#ff5cb8);-webkit-background-clip:text;background-clip:text;color:transparent}.rw{display:flex;align-items:center;gap:4px;white-space:nowrap}.rw .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.m{display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-size:10px;color:#1a0d40;background:linear-gradient(#cfe0ff,#8aa4e6)}.m0{background:linear-gradient(#fff3a0,#ffb800)}.m1{background:linear-gradient(#fff,#b8c4d8)}.m2{background:linear-gradient(#ffd0a0,#cd7f32)}.pt{color:#ffd84a;font-weight:800;text-shadow:0 0 6px rgba(255,200,60,.6)}.st{color:#ffb800}
#rank{top:6px;left:4px;width:114px;box-sizing:border-box;font-size:9.5px;padding:4px 6px}#rank h4,#jar h4{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#jar #lt{font-size:9px;line-height:1.25}#rank .m{width:12px;height:12px;line-height:12px;font-size:9px}
#jar{top:6px;right:4px;width:114px;box-sizing:border-box;font-size:9.5px;padding:4px 6px}
#banner{top:132px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;max-width:80%}#ctl{transition:opacity .4s}.zoom #ctl{opacity:0;pointer-events:none}#lg{position:fixed;top:6px;left:50%;transform:translateX(-50%);width:164px;display:block;border-radius:14px;box-shadow:0 0 14px rgba(80,160,255,.55),0 0 22px rgba(255,60,170,.4);transition:opacity .4s;pointer-events:none}
#ctl{bottom:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start;max-width:calc(100% - 16px);box-sizing:border-box;padding:8px}#tg{position:fixed;left:4px;top:136px;font-size:10px;padding:3px 6px;opacity:.85}.hide #ctl{display:none}
button,input,select{font:inherit;font-size:12px;border:0;border-radius:9px;padding:5px 8px}
button{background:var(--ac);color:#3a1d00;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
input{width:84px}
#lg{animation:lgosc 32s ease-in-out infinite}
@keyframes lgosc{0%{opacity:0;transform:translateX(-50%) scale(.9)}5%{opacity:1;transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.04)}55%{transform:translateX(-50%) scale(1)}68%{opacity:1;transform:translateX(-50%) scale(1)}74%{opacity:0;transform:translateX(-50%) scale(.9)}100%{opacity:0;transform:translateX(-50%) scale(.9)}}
</style></head><body>
