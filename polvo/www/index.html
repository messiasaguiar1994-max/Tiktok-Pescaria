const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function easeBack(t) { const c = 1.7; t = clamp(t, 0, 1) - 1; return t * t * ((c + 1) * t + c) + 1; }

const pedrinhas = []; seed = 11;
for (let i = 0; i < 40; i++) pedrinhas.push({ x: srnd() * W, y: 830 + srnd() * 120, r: 2 + srnd() * 5, c: srnd() < .5 ? '#c9a46a' : '#e8c991' });

// =================== ÁUDIO ===================
let AC = null, master, musicGain, sfxGain;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = .32; musicGain.connect(master);
  sfxGain = AC.createGain(); sfxGain.gain.value = .55; sfxGain.connect(master);
  setInterval(agendarMusica, 40);
}
function tom(m, when, dur, type, g, dest) {
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.value = mtof(m);
  gn.gain.setValueAtTime(0.0001, when);
  gn.gain.linearRampToValueAtTime(g, when + .012);
  gn.gain.exponentialRampToValueAtTime(.0001, when + dur);
  o.connect(gn); gn.connect(dest); o.start(when); o.stop(when + dur + .05);
}
function marimba(m, when, g = .25, dest = musicGain) { tom(m, when, .45, 'sine', g, dest); tom(m + 12, when, .12, 'triangle', g * .25, dest); }
// música original: progressão alegre de "fundo do mar"
const BPM = 108, OITAVA = 60 / BPM / 2;
const partes = [
  [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],
  [[53, 57, 60], [55, 59, 62], [52, 55, 59], [57, 60, 64]],
];
const padroes = [[0, 1, 2, 1, 0, 2, 1, 2], [0, 2, 1, 2, 0, 1, 2, 1]];
const hook = [79, null, 76, 77, 79, null, 84, null, 81, null, 79, 77, 76, null, 74, null];
let proxTempo = 0, passo = 0;
function agendarMusica() {
  if (!AC) return;
  if (proxTempo < AC.currentTime) proxTempo = AC.currentTime + .05;
  while (proxTempo < AC.currentTime + .25) {
    const compasso = Math.floor(passo / 8), oit = passo % 8;
    const sec = Math.floor(compasso / 8) % 2;
    const acorde = partes[sec][compasso % 4];
    const pad = padroes[sec][oit];
    marimba(acorde[pad] + 12, proxTempo, .16);
    if (oit === 0 || oit === 4) tom(acorde[0] - 12, proxTempo, .35, 'triangle', .3, musicGain);
    if (oit === 2 || oit === 6) bolhaSom(proxTempo, .05);
    if (compasso % 4 >= 2) { const h = hook[(passo % 16)]; if (h) marimba(h, proxTempo, .1); }
    proxTempo += OITAVA; passo++;
  }
}
function bolhaSom(when, g) {
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(500 + Math.random() * 400, when);
  o.frequency.exponentialRampToValueAtTime(1400, when + .08);
  gn.gain.setValueAtTime(g, when); gn.gain.exponentialRampToValueAtTime(.0001, when + .1);
  o.connect(gn); gn.connect(musicGain); o.start(when); o.stop(when + .12);
}
function abaixarMusica(sim) { if (AC) musicGain.gain.setTargetAtTime(sim ? .1 : .32, AC.currentTime, .25); }
function plim() { if (!AC) return; const t = AC.currentTime; tom(88, t, .6, 'sine', .35, sfxGain); tom(95, t + .12, .8, 'sine', .3, sfxGain); }
function fanfarra() { if (!AC) return; const t = AC.currentTime; [72, 76, 79, 84, 88].forEach((m, i) => { tom(m, t + i * .11, .5, 'triangle', .3, sfxGain); tom(m - 12, t + i * .11, .5, 'sine', .2, sfxGain); }); }

// =================== VOZ (cantar o nome) ===================
const synth = window.speechSynthesis || null;
let voz = null;
function escolherVoz() {
  if (!synth) return;
  const vs = synth.getVoices();
  voz = vs.find(v => /pt-BR/i.test(v.lang) && /google|francisca|natural|online/i.test(v.name)) ||
        vs.find(v => /pt-BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
}
if (synth) { escolherVoz(); synth.onvoiceschanged = escolherVoz; }
function limparNome(n) {
  let s = String(n || '').normalize('NFKC').replace(/[_\.]/g, ' ').replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
  if (s.length > 18) s = s.split(' ')[0];
  return s || 'amigo';
}
const TTSN = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) || null;
function falar(txt, pitch, rate) {
  const n = TTSN();
  if (n) { // voz nativa do Android (grátis)
    S.falando = true;
    return Promise.race([n.speak({ text: txt, lang: 'pt-BR', rate: rate, pitch: pitch, volume: 1, category: 'playback' }).catch(() => { vozFalhou++; }), new Promise(r => setTimeout(r, 9000))])
      .then(() => { S.falando = false; vozFuncionou = true; });
  }
  return new Promise(res => {
    if (!synth) return setTimeout(res, 800);
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; if (voz) u.voice = voz;
    u.pitch = pitch; u.rate = rate; u.volume = 1;
    let ok = false, comecou = false; const fim = () => { if (!ok) { ok = true; S.falando = false; res(); } };
    u.onstart = () => { comecou = true; vozFuncionou = true; vozFalhou = 0; S.falando = true; };
    u.onend = fim; u.onerror = () => { vozFalhou++; fim(); };
    setTimeout(() => { if (!comecou) { vozFalhou++; S.falando = true; setTimeout(fim, 600); } }, 1600);
    setTimeout(fim, 6000);
    try { synth.cancel(); synth.resume(); } catch (e) { }
    synth.speak(u);
  });
}
function melodia(ns, passoS = .22, g = .3) { if (!AC) return; const t = AC.currentTime; ns.forEach((m, i) => { if (m) { tom(m, t + i * passoS, .5, 'triangle', g, sfxGain); tom(m + 12, t + i * passoS, .2, 'sine', g * .35, sfxGain); } }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
let vozFuncionou = false, vozFalhou = 0;
function temVozAparelho() { return !!TTSN() || (!!synth && vozFalhou < 2); }

// ---------- RIMAS com o nome (grátis, sem internet) ----------

const MEIO = ['Sua rosa chegou como um abraço,', 'Obrigado pela rosa e pelo carinho,', 'Com essa rosa você me encantou,', 'Sua rosa deixou o mar mais bonito,'];
const VOG = 'aeiouáéíóúâêôãõà', ACENTO = /[áéíóúâêôãõ]/;
const semAcento = t => t.replace(/[áàâ]/g, 'a').replace(/[éê]/g, 'e').replace(/í/g, 'i').replace(/[óô]/g, 'o').replace(/ú/g, 'u');
function chaveRima(palavra) {
  let w = String(palavra).toLowerCase().replace(/[^a-záéíóúâêôãõàçüyw]/g, '');
  w = w.replace(/ão/g, 'ã').replace(/ãe/g, 'ã').replace(/õe/g, 'õ').replace(/lh/g, 'L').replace(/nh/g, 'N')
    .replace(/qu(?=[eiéíê])/g, 'k').replace(/gu(?=[eiéíê])/g, 'g').replace(/ch/g, 'x').replace(/ph/g, 'f').replace(/th/g, 't').replace(/h/g, '')
    .replace(/y/g, 'i').replace(/w/g, 'u').replace(/ç/g, 's').replace(/ss/g, 's').replace(/c(?=[eiéíê])/g, 's').replace(/c/g, 'k').replace(/g(?=[eiéíê])/g, 'j')
    .replace(/z$/, 's').replace(/ul$/, 'u').replace(/l$/, 'u').replace(/m$/, 'n');
  const g = []; // grupos de vogais
  for (let i = 0; i < w.length; i++) {
    if (!VOG.includes(w[i])) continue;
    let fim = i + 1;
    if ((w[fim] === 'i' || w[fim] === 'u') && !VOG.includes(w[fim + 1] || 'x') && fim < w.length) fim++;
    g.push({ ini: i, txt: w.slice(i, fim) }); i = fim - 1;
  }
  if (!g.length) return null;
  let t = -1;
  for (let k = 0; k < g.length; k++) if (ACENTO.test(g[k].txt)) t = k;
  if (t < 0) t = /(a|e|o|as|es|os|am|em|ens)$/.test(w) && g.length > 1 ? g.length - 2 : g.length - 1;
  const key = semAcento(w.slice(g[t].ini)).replace(/s$/, '');
  const depois = w.slice(g[t].ini + g[t].txt.length);
  return { key, sv: semAcento(g[t].txt), fv: semAcento(g[g.length - 1].txt), nasal: /^[mn]([^aeiouáéíóúâêô]|$)/.test(depois) || /[ãõ]/.test(g[t].txt) };
}
const BANCO = VERSOS.map(v => ({ v, c: chaveRima(v.replace(/[?!.,]+$/, '').split(' ').pop()) }));
function rimasPara(nome) {
  const c = chaveRima(nome); if (!c) return null;
  const testes = [
    b => b.c.key === c.key,
    b => b.c.sv === c.sv && b.c.fv === c.fv && b.c.nasal === c.nasal,
    b => b.c.sv === c.sv && b.c.fv === c.fv,
    b => b.c.fv === c.fv && b.c.nasal === c.nasal,
    b => b.c.fv.slice(-1) === c.fv.slice(-1),
  ];
  const ult = semAcento(nome.toLowerCase()).split(' ').pop();
  const out = [];
  for (const teste of testes) {
    const novos = BANCO.filter(b => teste(b) && !out.includes(b.v) && b.v.split(' ').pop() !== ult).map(b => b.v).sort(() => Math.random() - .5);
    out.push(...novos);
    if (out.length >= 3) break;
  }
  return out.length >= 3 ? out : null;
}

}

// ---------- VOZ HUMANA (OpenAI, opcional) ----------

try { CFG.chave = localStorage.getItem('pipo_chave') || ''; CFG.voz = localStorage.getItem('pipo_voz') || 'coral'; } catch (e) { }
let statusOpenAI = CFG.chave ? 'chave salva (ainda não testada)' : 'desligada (sem chave)';
const cacheVoz = new Map();
async function comTempo(p, ms) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('demorou')), ms))]); }
async function letraIA(bruto) {
  const nome = nomeCanto(bruto);
  const r = await comTempo(fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CFG.chave },
    body: JSON.stringify({ model: 'gpt-4o-mini', temperature: .9, max_tokens: 90, messages: [
      { role: 'system', content: 'Você escreve poeminhas curtos e alegres em português do Brasil para um polvinho recitar numa live do TikTok.' },
      { role: 'user', content: `Escreva 4 versos curtos (no máximo 7 palavras cada) agradecendo ${nome} por mandar uma rosa. O 1º verso começa com "Oi, ${nome}". Os versos 1, 3 e 4 precisam rimar com o nome ${nome}. Os versos devem fazer a pessoa se sentir muito especial e querida (elogios carinhosos, nada genérico). Não diga "esse poema é pra você". Não use palavras de gênero (amigo/amiga, lindo/linda para a pessoa). Nada ofensivo. Responda só com os 4 versos, um por linha.` }] })
  }), 5000);
  if (!r.ok) throw new Error('OpenAI ' + r.status);

    if (feliz) {
      ctx.strokeStyle = '#3a1630'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey + 6, 14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (piscando) {
      ctx.strokeStyle = '#3a1630'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(ex - 14, ey); ctx.lineTo(ex + 14, ey); ctx.stroke();
    } else {
      const big = pose === 'surprise' ? 1.15 : 1;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, 20 * big, 25 * big, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#2a1230'; ctx.beginPath(); ctx.ellipse(ex + ox, ey + 3 + oy, 11, 13, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + ox + 4, ey - 3 + oy, 4, 0, 7); ctx.fill();
    }
  }
  // bochechas
  ctx.fillStyle = 'rgba(255,90,140,.55)'; ctx.beginPath(); ctx.ellipse(-55, 18, 13, 8, 0, 0, 7); ctx.ellipse(55, 18, 13, 8, 0, 0, 7); ctx.fill();
  // boca
  ctx.fillStyle = '#7a1838'; ctx.strokeStyle = '#7a1838'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  if (pose === 'sing') {
    const nv = nivelVoz();
    const ab = nv !== null ? 4 + nv * 18 : (S.falando ? 6 + Math.abs(Math.sin(t * 13)) * 12 : 5);
    ctx.beginPath(); ctx.ellipse(0, 30, 13, ab, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff7aa0'; ctx.beginPath(); ctx.ellipse(0, 30 + ab * .45, 8, ab * .35, 0, 0, 7); ctx.fill();
  } else if (pose === 'cheer' || pose === 'surprise') {
    ctx.beginPath(); ctx.arc(0, 22, 20, 0, Math.PI); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 20, 18, .2, Math.PI - .2); ctx.stroke();
  }
  ctx.restore();
}
function tentaculo(bx, by, d, lift, i, pose) {
  const t = S.t, segs = 16, comp = 9;
  const baixo = Math.PI / 2 - d * .95, cima = -Math.PI / 2 + d * .75;
  let ang = lerp(baixo, cima, lift);
  const pts = []; let x = bx, y = by;
  for (let k = 0; k <= segs; k++) {
    const u = k / segs;
    pts.push({ x, y, r: 22 * (1 - u * .74) });
    const onda = Math.sin(t * (lift > .5 ? 7 : 3) + i * 1.3 + u * 4) * (lift > .5 ? .35 : .22);
    const a = ang - d * u * 1.3 * (1 - lift) + onda * u - (lift > .5 ? d * u * .6 : 0);
    x += Math.cos(a) * comp; y += Math.sin(a) * comp;
  }
  const g = ctx.createLinearGradient(0, by, 0, by + 140);
  g.addColorStop(0, '#ff6f99'); g.addColorStop(1, '#ff9bb8');
  ctx.fillStyle = g;
  for (let k = pts.length - 1; k >= 0; k--) { const p = pts[k]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffd1df';
  for (let k = 2; k < pts.length; k += 2) { const p = pts[k]; ctx.beginPath(); ctx.arc(p.x + d * p.r * .35, p.y + p.r * .3, p.r * .32, 0, 7); ctx.fill(); }
  return pts[pts.length - 1];
}
function rosaDesenho(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#2e8b3e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 45); ctx.stroke();
  ctx.fillStyle = '#3cb44b'; ctx.beginPath(); ctx.ellipse(10, 25, 10, 5, -.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8173d';
  for (let k = 0; k < 5; k++) { const a = k * 1.256 + S.t * .3; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 9, -6 + Math.sin(a) * 7, 13, 11, a, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#b30f2e'; ctx.beginPath(); ctx.arc(0, -8, 8, 0, 7); ctx.fill();
  ctx.restore();
}

// =================== INTERFACE (barra, faixa, legendas) ===================
function barra() {
  const x = 40, y = 34, w = W - 80, h = 30, pct = clamp(S.likes / S.meta, 0, 1);
  ctx.fillStyle = 'rgba(10,20,50,.55)'; rrect(x - 4, y - 4, w + 8, h + 30, 14); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(x, y, w, h, 12); ctx.fill();
  if (pct > 0) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#ff3d6e'); g.addColorStop(1, '#ff8fb1');
    ctx.fillStyle = g; rrect(x, y, Math.max(24, w * pct), h, 12); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${.25 + .2 * Math.sin(S.t * 4)})`;
    rrect(x + 4, y + 4, Math.max(16, w * pct - 8), 8, 4); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.font = `bold 18px ${FONTE}`; ctx.textAlign = 'center';
  ctx.fillText(Math.floor(pct * 100) + '%', W / 2, y + 21);
  ctx.font = `13px ${FONTE}`; ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText(`Chuva de corações ❤️ ${S.likes.toLocaleString('pt-BR')} / ${S.meta.toLocaleString('pt-BR')} curtidas`, W / 2, y + h + 18);
}
function faixa() {
  if (S.metaMsg > 0) {
    const a = clamp(S.metaMsg, 0, 1), k = easeBack((4.5 - S.metaMsg) * 2.5);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 200); ctx.scale(k, k);
    ctx.fillStyle = '#ffd54a'; rrect(-200, -45, 400, 90, 24); ctx.fill();
    ctx.fillStyle = '#7a3b00'; ctx.textAlign = 'center'; ctx.font = `bold 30px ${FONTE}`; ctx.fillText('META BATIDA! 🎉', 0, -5);
    ctx.font = `bold 17px ${FONTE}`; ctx.fillText('Nova meta: ' + S.meta.toLocaleString('pt-BR') + ' curtidas', 0, 26);
    ctx.restore();
  }
  if (!S.cur) return;
  const c = S.cur, k = easeBack((S.t - c.t0) * 2.5);
  ctx.save(); ctx.translate(W / 2, 195); ctx.scale(k, k);
  const g = ctx.createLinearGradient(-220, 0, 220, 0); g.addColorStop(0, '#8f3dff'); g.addColorStop(1, '#ff4d8d');
  ctx.fillStyle = g; rrect(-225, -58, 450, 116, 28); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; rrect(-225, -58, 450, 116, 28); ctx.stroke();
  // foto
  const ax = -165;
  ctx.save(); ctx.beginPath(); ctx.arc(ax, 0, 44, 0, 7); ctx.clip();
  if (c.img) ctx.drawImage(c.img, ax - 44, -44, 88, 88);
  else { ctx.fillStyle = '#ffd54a'; ctx.fillRect(ax - 44, -44, 88, 88); ctx.fillStyle = '#8f3dff'; ctx.font = `bold 44px ${FONTE}`; ctx.textAlign = 'center'; ctx.fillText((limparNome(c.nome)[0] || '?').toUpperCase(), ax, 16); }
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(ax, 0, 44, 0, 7); ctx.stroke();
  // nome
  ctx.textAlign = 'left'; let fs = 38;
  do { ctx.font = `bold ${fs}px ${FONTE}`; fs -= 2; } while (ctx.measureText(c.nome).width > 290 && fs > 16);
  ctx.lineWidth = 6; ctx.strokeStyle = '#4a0e5c'; ctx.strokeText(c.nome, -105, -4);
  ctx.fillStyle = '#fff'; ctx.fillText(c.nome, -105, -4);
  ctx.font = `bold 19px ${FONTE}`; ctx.fillStyle = '#ffe9a8';
  ctx.fillText(c.cantando ? '📜 Um poema pra você...' : 'Obrigado pela rosa! 🌹', -105, 32);
  ctx.restore();
  // fila
  if (S.fila.length) {
    const nomes = S.fila.slice(0, 4).map(e => e.nome).join(' · ');
    ctx.font = `bold 15px ${FONTE}`; ctx.textAlign = 'center';
    const tw = Math.min(W - 40, ctx.measureText('Próximos: ' + nomes).width + 30);
    ctx.fillStyle = 'rgba(10,20,50,.55)'; rrect(W / 2 - tw / 2, 270, tw, 30, 15); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText('🌹 Próximos: ' + nomes + (S.fila.length > 4 ? ' +' + (S.fila.length - 4) : ''), W / 2, 291);
  }
}
function karaoke() {
  if (!S.cur || !S.cur.cantando || !S.cur.letra) return;
  const L = S.cur.letra, i = clamp(S.cur.linha, 0, L.length - 1);
  const y = 345;
  ctx.fillStyle = 'rgba(10,20,50,.6)'; rrect(20, y - 32, W - 40, 92, 22); ctx.fill();
  ctx.textAlign = 'center';
  let fs = 30; do { ctx.font = `bold ${fs}px ${FONTE}`; fs -= 2; } while (ctx.measureText(L[i]).width > W - 70 && fs > 14);
  ctx.lineWidth = 6; ctx.strokeStyle = '#7a1838'; ctx.strokeText('✨ ' + L[i], W / 2, y + 6);
  ctx.fillStyle = '#ffe14d'; ctx.fillText('✨ ' + L[i], W / 2, y + 6);
  if (L[i + 1]) { ctx.font = `17px ${FONTE}`; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText(L[i + 1], W / 2, y + 42); }
}
const textosLegenda = [['🌹', 'Mande uma rosa', 'e ganhe um poema!'], ['❤️', 'Curta a live', 'para encher a barra!'], ['📜', 'Rosa = um poema', 'com o seu nome!']];
const lugaresLegenda = [[150, 900], [400, 770], [400, 420], [130, 400], [270, 880]];
let ultLugar = -1, ultTexto = -1;
function legendas(dt) {
  S.proxLegenda -= dt;
  if (S.proxLegenda <= 0 && !S.cur) {
    let li; do { li = Math.floor(Math.random() * lugaresLegenda.length); } while (li === ultLugar);
    ultLugar = li; ultTexto = (ultTexto + 1) % textosLegenda.length;
    S.legendas.push({ x: lugaresLegenda[li][0], y: lugaresLegenda[li][1], txt: textosLegenda[ultTexto], vida: 0, dur: 5 });
    S.proxLegenda = rnd(8, 12);
  }
  for (const L of S.legendas) {
    L.vida += dt;
    const a = Math.min(1, L.vida * 3, (L.dur - L.vida) * 2), k = easeBack(L.vida * 3);
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(L.x, L.y + Math.sin(S.t * 2) * 4); ctx.scale(k, k);
    ctx.fillStyle = 'rgba(255,255,255,.93)'; rrect(-115, -34, 230, 68, 20); ctx.fill();
    ctx.font = `30px ${FONTE}`; ctx.textAlign = 'center'; ctx.fillText(L.txt[0], -82, 11);
    ctx.fillStyle = '#7a1838'; ctx.font = `bold 17px ${FONTE}`; ctx.textAlign = 'left';
    ctx.fillText(L.txt[1], -60, -4); ctx.font = `15px ${FONTE}`; ctx.fillStyle = '#334'; ctx.fillText(L.txt[2], -60, 18);
    ctx.restore();
  }
  S.legendas = S.legendas.filter(L => L.vida < L.dur);
}

// =================== PARTÍCULAS ===================
function particulas(dt) {
  for (const b of bolhas) {
    b.y -= b.v * dt; b.x += Math.sin(S.t * 2 + b.f) * .3;
    if (b.y < -10) { b.y = H + 10; b.x = rnd(0, W); }
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .3, 0, 7); ctx.fill();
  }
  // notas musicais quando canta
  if (S.cur && S.cur.cantando && Math.random() < .12) notas.push({ x: 270 + rnd(-70, 70), y: 500, v: rnd(50, 90), f: rnd(0, 6), c: ['#ffd54a', '#fff', '#9cffb0', '#ffb3e6'][Math.floor(rnd(0, 4))], s: rnd(22, 36), ch: Math.random() < .5 ? '♪' : '♫', vida: 0 });
  for (const n of notas) { n.vida += dt; n.y -= n.v * dt; n.x += Math.sin(S.t * 3 + n.f) * .8; ctx.globalAlpha = clamp(2.5 - n.vida, 0, 1); ctx.fillStyle = n.c; ctx.font = `bold ${n.s}px ${FONTE}`; ctx.textAlign = 'center'; ctx.fillText(n.ch, n.x, n.y); }
  ctx.globalAlpha = 1;
  for (const h of coracoes) { h.vida += dt; h.y -= h.v * dt; h.x += Math.sin(S.t * 3 + h.f) * .7; ctx.globalAlpha = clamp(3 - h.vida, 0, 1); ctx.font = `${h.s}px ${FONTE}`; ctx.textAlign = 'center'; ctx.fillText('❤️', h.x, h.y); }
  ctx.globalAlpha = 1;
  for (const p of petalas) { p.vida += dt; p.y += p.vy * dt; p.x += Math.sin(S.t * 2 + p.f) * 1; p.r += dt * 2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = clamp(5 - p.vida, 0, 1); ctx.fillStyle = '#e8173d'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, 7); ctx.fill(); ctx.restore(); }
  for (const c of confetes) { c.y += c.vy * dt; c.x += c.vx * dt; c.r += c.vr * dt; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
  ctx.globalAlpha = 1;
  limpar(notas, n => n.vida < 2.5); limpar(coracoes, h => h.vida < 3); limpar(petalas, p => p.vida < 5 && p.y < H + 20); limpar(confetes, c => c.y < H + 20);
}
function limpar(arr, ok) { for (let i = arr.length - 1; i >= 0; i--) if (!ok(arr[i])) arr.splice(i, 1); }

// =================== LOOP PRINCIPAL ===================
let ultimo = performance.now();
function quadro(agora) {
  const dt = clamp((agora - ultimo) / 1000, 0, .05); ultimo = agora; S.t += dt;
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  // poses automáticas (o personagem nunca fica parado do mesmo jeito)
  S.poseT += dt;
  if (!S.cur && S.celebra <= 0 && S.poseT > S.poseDur) {
    let p; do { p = poses[Math.floor(Math.random() * poses.length)]; } while (p === S.pose);
    S.pose = p; S.poseT = 0; S.poseDur = p === 'spin' ? 1.6 : p === 'swim' ? rnd(6, 8) : rnd(3.5, 6);
  }
  S.nextBlink -= dt; if (S.nextBlink <= 0) { S.blinkT = .15; S.nextBlink = rnd(2, 5); }
  if (S.celebra > 0) S.celebra -= dt; if (S.metaMsg > 0) S.metaMsg -= dt;

  fundo();
  aguaViva(90, 0); aguaViva(460, 2);
  tartaruga(dt);
  rochaArco(); casaConcha();
  for (const a of algas) alga(a);
  areia(); corais(); placa();
  for (const p of peixes) peixe(p, dt);
  limpar(peixes, p => p.x > -80 && p.x < W + 80);
  while (peixes.length < 8) novoPeixe(false);
  pipo();
  if (S.cur) {
    const k = clamp((S.t - S.cur.t0) / 1, 0, 1);
    const x = lerp(W / 2, pontaRosa.x, k), y = lerp(150, pontaRosa.y - 30, k) - Math.sin(k * Math.PI) * 80;
    rosaDesenho(x, y, .9 + Math.sin(S.t * 4) * .05);
  }
  particulas(dt);
  desenharChats(dt);
  legendas(dt);
  barra(); faixa(); karaoke();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

// =================== LIGAÇÃO COM O APP (app.js) ===================
function atualizarStatus() { }
window.ligarSom = function (on) {
  if (!AC) { try { initAudio(); } catch (e) { } }
  if (AC) { if (AC.state === 'suspended') AC.resume(); master.gain.value = on ? .9 : 0; }
};
window.novoEvento = function (tipo, nome, foto) {
  if (tipo === 'rosa') rosa(nome, foto);
  else if (tipo === 'comentario') chats.push({ nome: String(nome).slice(0, 22), x: rnd(30, 200), y: 900, vida: 0 });
};
window.curtidasLive = n => curtidas(n);
window.testarVoz = () => falar('Oi! Eu sou o Pipo, o polvo poeta!', 1.1, 1.05);
const chats = [];
function desenharChats(dt) {
  for (const c of chats) {
    c.vida += dt; c.y -= 45 * dt;
    const a = clamp(Math.min(c.vida * 3, 4 - c.vida), 0, 1); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.font = `bold 16px ${FONTE}`; ctx.textAlign = 'left';
    const t = '💬 ' + c.nome, w = ctx.measureText(t).width + 20;
    ctx.fillStyle = 'rgba(255,255,255,.88)'; rrect(c.x, c.y - 20, w, 30, 15); ctx.fill();
    ctx.fillStyle = '#123a6b'; ctx.fillText(t, c.x + 10, c.y + 1); ctx.restore();
  }
  limpar(chats, c => c.vida < 4);
}
</script>
