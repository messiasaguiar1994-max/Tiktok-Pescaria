# Monta o aplicativo do POLVO POETA (.APK) sozinho sempre que algo muda no galho "polvo".
# O APK pronto fica em "Releases", com o nome "Polvo Poeta v1.N".
name: Montar APK do Polvo
on:
  push:
    branches: [polvo]
    paths: ['polvo/**', '.github/workflows/apk-polvo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polvo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android
      - name: Montar o APK
        working-directory: polvo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk polvo-poeta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polvo-poeta-apk
          path: polvo/polvo-poeta.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polvo-v1.${{ github.run_number }}
          name: Polvo Poeta v1.${{ github.run_number }}
          body: "Baixe o arquivo polvo-poeta.apk abaixo e instale no celular."
          files: polvo/polvo-poeta.apk
          target_commitish: ${{ github.sha }}
          make_latest: false
