# Monta o aplicativo do ELEFANTE PINTOR (.APK) sozinho sempre que algo muda no galho "elefante".
# O APK pronto fica em "Releases", com o nome "Elefante Pintor v1.N".
name: Montar APK do Elefante
on:
  push:
    branches: [elefante]
    paths: ['elefante/**', '.github/workflows/apk-elefante.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elefante
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android
      - name: Montar o APK
        working-directory: elefante/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk elefante-pintor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: elefante-pintor-apk
          path: elefante/elefante-pintor.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elefante-v1.${{ github.run_number }}
          name: Elefante Pintor v1.${{ github.run_number }}
          body: "Baixe o arquivo elefante-pintor.apk abaixo e instale no celular."
          files: elefante/elefante-pintor.apk
          target_commitish: ${{ github.sha }}
          make_latest: false
