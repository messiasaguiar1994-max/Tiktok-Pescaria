# Monta o aplicativo do ZOMBIE RUSH (.APK) sozinho sempre que algo muda no galho "zumbi".
# O APK pronto fica em "Releases", com o nome "Zombie Rush v1.N".
name: Montar APK do Polvo
on:
  push:
    branches: [zumbi]
    paths: ['zumbi/**', '.github/workflows/apk-zumbi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zumbi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android
      - name: Montar o APK
        working-directory: zumbi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk zombie-rush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zombie-rush-apk
          path: zumbi/zombie-rush.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zumbi-v1.${{ github.run_number }}
          name: Zombie Rush v1.${{ github.run_number }}
          body: "Baixe o arquivo zombie-rush.apk abaixo e instale no celular."
          files: zumbi/zombie-rush.apk
          target_commitish: ${{ github.sha }}
          make_latest: false
