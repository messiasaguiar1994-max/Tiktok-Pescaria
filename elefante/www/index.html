<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Elefante Pintor da Savana</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#f3d9a8;font-family:'Nunito',sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}
  .hud{position:fixed;pointer-events:none;z-index:5}
  #banner{top:12px;left:50%;transform:translateX(-50%);text-align:center;width:94%;max-width:520px}
  #banner .t1{font-family:'Lilita One';font-size:clamp(19px,5.8vw,32px);color:#fff;
    -webkit-text-stroke:2px #0d4f8b;text-shadow:0 4px 0 #0d4f8b,0 6px 14px rgba(0,0,0,.25);letter-spacing:.5px;line-height:1.05}
  #legend{top:58px;right:8px;background:rgba(255,255,255,.9);border-radius:14px;padding:7px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);
    transition:opacity 1.2s;font-weight:900;color:#0d4f8b;font-size:clamp(11px,3vw,14px);max-width:64vw}
  #legend .r{display:flex;align-items:center;gap:6px;margin:2px 0;white-space:nowrap}
  #legend .ic{font-size:1.4em;width:1.4em;text-align:center}
  #legend .r.gold{color:#a8700c}#legend .r.pink{color:#c2187a}#legend .r.ride{color:#9a4a12}
  #legend.off{opacity:0}
  #queue{top:58px;left:8px;background:rgba(13,79,139,.84);border-radius:14px;padding:7px 9px;min-width:110px;max-width:34vw;
    color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  #queue h3{font-family:'Lilita One';font-weight:400;font-size:14px;margin-bottom:3px;color:#bfe9ff}
  #queue .row{display:flex;align-items:center;gap:5px;font-size:12px;margin:3px 0;white-space:nowrap;overflow:hidden}
  #queue .row img{width:20px;height:20px;border-radius:50%;border:2px solid #fff;object-fit:cover;flex:none}
  #queue .row span{overflow:hidden;text-overflow:ellipsis}
  #queue .empty{font-size:11px;opacity:.85}
  #toast{top:29%;left:50%;transform:translate(-50%,0) scale(.6);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);
    background:#fff;border-radius:18px;padding:10px 18px;font-family:'Lilita One';font-size:clamp(17px,5vw,24px);color:#0d4f8b;
    box-shadow:0 6px 0 #0d4f8b,0 10px 24px rgba(0,0,0,.25);text-align:center;max-width:92%}
  .gi{height:1.6em;vertical-align:middle;margin:0 2px}
  #queue .row .gq{width:18px;height:18px;border:none;border-radius:0}
  #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  #toast.gold{color:#8a5a00;box-shadow:0 6px 0 #c9921c,0 10px 24px rgba(0,0,0,.25);background:linear-gradient(#fffbe8,#ffe9a8)}
  #toast.pink{color:#b0105f;box-shadow:0 6px 0 #e05aa0,0 10px 24px rgba(0,0,0,.25);background:linear-gradient(#fff0f8,#ffd0ea)}
  #toast.ride{color:#7a3a08;box-shadow:0 6px 0 #b8661c,0 10px 24px rgba(0,0,0,.25);background:linear-gradient(#fff6e6,#ffd9a0)}
  #toast.adv{color:#1d6b2a;box-shadow:0 6px 0 #3c9a4a,0 10px 24px rgba(0,0,0,.25);background:linear-gradient(#f2fff2,#c9f5c9)}
  #chips{left:8px;bottom:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;transition:bottom .3s}
  .chip{background:rgba(0,0,0,.42);color:#fff;border-radius:999px;padding:4px 11px;font-weight:900;font-size:12px}
  #panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;width:96%;max-width:560px;
    background:rgba(255,255,255,.95);border-radius:16px;padding:9px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #panel .lbl{font-weight:900;color:#0d4f8b;font-size:12px;margin-bottom:6px}
  #panel .line{display:flex;gap:6px;flex-wrap:wrap}
  #panel input[type=text]{flex:1;min-width:110px;border:2px solid #9cc9ea;border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
  #panel button,#panel label.btn{border:none;border-radius:10px;padding:8px 10px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;
    background:#2aa7e8;color:#fff;box-shadow:0 3px 0 #156d9c;white-space:nowrap}
  #panel button.rose{background:#e8455e;box-shadow:0 3px 0 #a3122f}
  #panel button.heart{background:#ec5fb0;box-shadow:0 3px 0 #a8226f}
  #panel button.ride{background:#d98a2b;box-shadow:0 3px 0 #96560f}
  #panel button.alt,#panel label.btn{background:#ffb84d;box-shadow:0 3px 0 #c27a14}
  #panel button.adv{background:#3c9a4a;box-shadow:0 3px 0 #22662c}
  #panel button.ghost{background:#e9eef4;color:#335;box-shadow:0 3px 0 #b8c3d0}
  #panel button:active{transform:translateY(2px);box-shadow:none}
  #panel input[type=file]{display:none}
  #showPanel{position:fixed;right:8px;bottom:8px;z-index:9;width:34px;height:34px;border-radius:50%;border:none;
    background:rgba(255,255,255,.3);font-size:16px;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud" id="banner"><div class="t1">PASSEIO DO ELEFANTE PINTOR 🐘💦</div></div>
<div class="hud" id="queue"><h3>🎨 Próximos</h3><div id="qlist"></div></div>
<div class="hud" id="toast"></div>
<div class="hud" id="chips"><div class="chip" id="riderChip" style="display:none"></div><div class="chip" id="where">📍 Savana</div><div class="chip" id="song" style="display:none">🎵</div></div>

<div id="panel">
  <div class="lbl">🧪 PAINEL DE TESTE — some com "Esconder" (ou tecla T)</div>
  <div class="line">
    <input type="text" id="nameIn" placeholder="Nome (vazio = aleatório)" maxlength="24">
    <label class="btn" for="fileIn" id="fileLbl">📷 Foto</label><input type="file" id="fileIn" accept="image/*">
  </div>
  <div class="line" style="margin-top:6px">
    <button data-k="comment">💬 Comentário</button>
    <button class="rose" data-k="rose">🌹 Rosa</button>
    <button class="heart" data-k="heart">🫰 Coração</button>
    <button class="ride" data-k="ride">🍩 Rosquinha</button>
  </div>
  <div class="line" style="margin-top:6px">
    <button class="alt" id="btnMany">👥 5 comentários</button>
    <button class="adv" id="btnAdv">🎲 Aventura</button>
    <button class="ghost" id="btnClear">🧹 Descer todos</button>
    <button class="ghost" id="btnSound">🔇 Ligar som</button>
    <button class="ghost" id="btnNext" style="display:none">⏭️ Música</button>
    <button class="ghost" id="btnHide">🙈 Esconder</button>
  </div>
</div>
<button id="showPanel" title="Mostrar painel">⚙️</button>

<script>window.APP_MODE=true;</script>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>

function bgSplash(x,r,colors,cy=320){
  x.fillStyle='rgba(255,250,236,0.96)';x.beginPath();x.ellipse(256,cy,215,285,0,0,Math.PI*2);x.fill();
  for(let i=0;i<56;i++){const a=r()*Math.PI*2,d=165+r()*80;x.fillStyle=colors[(r()*colors.length)|0];x.beginPath();
    x.arc(256+Math.cos(a)*d*0.95,cy+Math.sin(a)*d*1.2,16+r()*36,0,Math.PI*2);x.fill();}
  for(let i=0;i<9;i++){const px=90+r()*330,w=10+r()*16,len=40+r()*60;x.fillStyle=colors[(r()*colors.length)|0];x.fillRect(px-w/2,565,w,len);x.beginPath();x.arc(px,565+len,w/2+3,0,Math.PI*2);x.fill();}
  for(let i=0;i<26;i++){x.fillStyle=colors[(r()*colors.length)|0];x.beginPath();x.arc(r()*512,r()*640,3+r()*9,0,Math.PI*2);x.fill();}
}
function goldGrad(x,cx,cy,R){const g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  ['#fff6c2','#e2a823','#fff0a0','#b97a17','#ffe27a','#c98a1c','#fff6c2'].forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c));return g;}
function ribbon(x,cy,w,h,c1,c2){
  const L=256-w/2,R=256+w/2;x.fillStyle=c2;
  for(const sd of[-1,1]){const ex=sd<0?L:R;x.beginPath();x.moveTo(ex,cy-h/2+14);x.lineTo(ex+sd*48,cy-h/2+14);x.lineTo(ex+sd*30,cy+14);x.lineTo(ex+sd*48,cy+h/2+14);x.lineTo(ex,cy+h/2+14);x.fill();}
  const g=x.createLinearGradient(0,cy-h/2,0,cy+h/2);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;
  x.beginPath();x.moveTo(L,cy-h/2);x.quadraticCurveTo(256,cy-h/2-14,R,cy-h/2);x.lineTo(R,cy+h/2);x.quadraticCurveTo(256,cy+h/2-14,L,cy+h/2);x.closePath();x.fill();
  x.lineWidth=6;x.strokeStyle=goldGrad(x,256,cy,w/2);x.stroke();
}
function fitFont(x,text,max,size){let fs=size;x.font=`${fs}px ${FONT}`;while(x.measureText(text).width>max&&fs>26){fs-=2;x.font=`${fs}px ${FONT}`;}return fs;}

    if(crown){x.font='108px serif';x.fillText('👑',cx,cy-R-34);x.font='40px serif';[[60,120],[452,150],[52,420],[460,440]].forEach(([px,py])=>x.fillText('🐾',px,py));}
    else if(k==='heart'){x.font='64px serif';x.fillText('💘',70,80);x.fillText('💞',445,90);}
    const rc=k==='heart'?['#ff5fae','#b0186a']:['#ee3f5c','#a3122f'];

  }

const revealing=new Set(),drying=new Set();
function updateDrying(dt){drying.forEach(p=>{p.dry=Math.min(1,p.dry+dt/(p.reveal+7));const m=p.mesh.material;m.roughness=lerp(.25,.7,p.dry);m.envMapIntensity=lerp(.3,.1,p.dry);if(p.dry>=1)drying.delete(p);});}
function startReveal(p,job){
  p.final=composeFinal(job,p.W,p.H,p.kind);p.active=true;p.t=0;p.kindJob=job.kind;revealing.add(p);
  if(p.normalTex&&p.normalTex!==FLAT_N)p.normalTex.dispose();p.normalTex=makeNormalMap(p.final,6,job.circle);p.mesh.material.normalMap=p.normalTex;
  p.dry=0;drying.add(p);
  const n=24,cw=512/n;p.cols=[];
  for(let i=0;i<n;i++){const cxp=(i+.5)*cw+rand(-4,4);p.cols.push({x:cxp,w:cw*1.3,s:rand(.8,1.25),d:rand(0,.15)+Math.abs(cxp-256)/256*.18});}
  p.blobs=[];for(let i=0;i<20;i++)p.blobs.push({x:rand(20,492),y:rand(10,130),r:rand(30,70)});
}
function updateReveal(p,dt){
  p.t=Math.min(1,p.t+dt/p.reveal);const t=p.t,W=p.W,H=p.H,sx=W/512,sy=H/640;
  const mask=getMask(W,H);const mc=mask.getContext('2d');mc.setTransform(1,0,0,1,0,0);mc.clearRect(0,0,W,H);mc.setTransform(sx,0,0,sy,0,0);mc.fillStyle='#000';
  const bt=Math.min(1,t/0.2);for(const b of p.blobs){mc.beginPath();mc.arc(b.x,b.y,b.r*bt,0,Math.PI*2);mc.fill();}
  const heads=[];
  for(const c of p.cols){const len=clamp((t-c.d)/0.72*c.s,0,1.05)*640;
    if(len>0){mc.fillRect(c.x-c.w/2,0,c.w,len);mc.beginPath();mc.arc(c.x,len,c.w*0.6,0,Math.PI*2);mc.fill();if(len<640)heads.push([c.x,len,c.w]);}}
  if(t>0.8){mc.globalAlpha=(t-0.8)/0.2;mc.fillRect(0,0,512,640);mc.globalAlpha=1;}
  mc.setTransform(1,0,0,1,0,0);
  const x=p.ctx;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  x.globalCompositeOperation='source-over';x.drawImage(mask,0,0);
  x.globalCompositeOperation='source-in';x.drawImage(p.final,0,0);
  const tint=p.kindJob==='comment'?'80,165,255':p.kindJob==='heart'?'255,120,200':'255,220,120';
  x.globalCompositeOperation='source-atop';x.fillStyle=`rgba(${tint},${(1-t)*0.3})`;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='destination-over';x.globalAlpha=0.28*(1-t);x.drawImage(mask,0,0);x.globalAlpha=1;
  x.globalCompositeOperation='source-over';
  if(t<1){x.setTransform(sx,0,0,sy,0,0);for(const [hx,hy,w] of heads){const g=x.createRadialGradient(hx-3,hy-3,1,hx,hy,w*0.6);
      g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,`rgba(${tint},.6)`);x.fillStyle=g;x.beginPath();x.arc(hx,hy,w*0.6,0,Math.PI*2);x.fill();}
    x.setTransform(1,0,0,1,0,0);}
  p.tex.needsUpdate=true;
  if(t>=1){p.active=false;revealing.delete(p);p.final=null;}
}

function seatFor(i){const level=Math.floor(i/4),k=i%4;const z=SEATS[k];return {x:0,y:seatY(z)+level*1.32,z};}
function addRider(name,photo,silent,icon='rosquinha'){
  if(riders.some(r=>r.name===name)){if(!silent)toast(`${gi(icon)} <b>${escapeHtml(name)}</b> já está em cima do elefante! 🐘`,2.4,'ride');return;}
  if(riders.length>=16)return;
  const img=new Image();
  img.onload=()=>{fontReady.then(()=>{
    const d=makeDoll(name,img);const i=riders.length;const s=seatFor(i);
    (E.riderParent||E.body).add(d.g);const rd={name,photo,...d,i,t0:clock.elapsedTime,seat:s};
    d.g.position.set(3.5,-1,s.z);d.tag.position.y=1.75+(i%3)*.5;riders.push(rd);saveRiders();updateRiderChip();
    if(!silent){toast(`${gi(icon)} <b>${escapeHtml(name)}</b> subiu no elefante! 🐘🎉`,2.8,'ride');giftSfx('ride');}
  });};
  const tries=Array.isArray(photo)?photo.slice(1):[];if(Array.isArray(photo))photo=photo[0];
  img.onerror=()=>{img.src=tries.length?tries.shift():makeAvatar(name);};
  if(photo&&!photo.startsWith('data:'))img.crossOrigin='anonymous';
  img.src=photo||makeAvatar(name);
}

function animateRiders(dt,time){
  riderJolt=Math.max(0,riderJolt-dt*1.5);
  const bucking=el.adv&&el.adv.type==='buck',dancing=el.adv&&el.adv.type==='dance';
  riders.forEach((r,i)=>{
    const s=r.seat;const k=clamp((time-r.t0)/1.1,0,1);
    if(k<1){r.g.position.set(lerp(3.5,s.x,k),lerp(-1,s.y,k)+Math.sin(k*Math.PI)*3,s.z);r.g.rotation.x=k*Math.PI*2;}
    else{
      r.g.rotation.x=Math.sin(time*2+i)*.04-el.fx.rx*.6;
      r.g.position.set(s.x,s.y+riderJolt*Math.abs(Math.sin(time*14+i))*.9+Math.abs(Math.sin(el.phase+i*.7))*.06*el.walk,s.z);
      r.g.rotation.z=-el.fx.rz*1.1+Math.sin(time*1.5+i)*.05;
    }
    let ax=-1.15,az=.15;
    if(bucking||riderJolt>.2){ax=-2.8+Math.sin(time*18+i*2)*.4;az=.5+Math.sin(time*13+i)*.3;}
    r.arms[0].rotation.x=ax;r.arms[0].rotation.z=-az;
    if(dancing||(k>=1&&((time+i*3)%9)<1.3)){r.arms[1].rotation.x=-2.9;r.arms[1].rotation.z=.4+Math.sin(time*10)*.4;}
    else{r.arms[1].rotation.x=ax;r.arms[1].rotation.z=az;}
    r.head.rotation.y=Math.sin(time*.7+i*1.3)*.35;
  });
}

    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    if(ty===0&&P){const d=(pPos[i*3]-P.center.x)*P.normal.x+(pPos[i*3+1]-P.center.y)*P.normal.y+(pPos[i*3+2]-P.center.z)*P.normal.z;

function genBars(seed,prog,bars,sparse,endTonic,barOffset=0){
  const r=seeded('mel'+seed);const notes=[];
  const T=sparse?[[0,6,8,14],[0,4,8,12],[0,3,8,10],[2,6,8,12],[0,8,11,12]]:[[0,3,6,8,10,12],[0,2,4,6,8,12,14],[0,4,6,8,11,12],[0,6,8,10,14],[0,2,3,4,8,10,12],[0,8,10,11,12,14],[2,4,6,8,12]];
  let deg=7+Math.floor(r()*3);
  for(let b=0;b<bars;b++){const tpl=T[Math.floor(r()*T.length)];const root=prog[(b+barOffset)%prog.length];
    tpl.forEach((s,i)=>{
      if(s===0||s===8){let best=deg,bd=99;for(let c=2;c<=13;c++){const dd=((c-root)%7+7)%7;if(dd===0||dd===2||dd===4){const dist=Math.abs(c-deg);if(dist<bd){bd=dist;best=c;}}}deg=best;}
      else{const mv=[-2,-1,-1,1,1,2,0,3,-3];let nd=deg+mv[Math.floor(r()*mv.length)];let k=0;while(!isPenta(nd)&&k<4){nd+=nd>deg?1:-1;k++;}deg=clamp(nd,2,13);}
      const nx=i+1<tpl.length?tpl[i+1]:16;notes.push({step:(b+barOffset)*16+s,deg,len:Math.min(nx-s,4)});});
  }
  if(endTonic&&notes.length){const l=notes[notes.length-1];l.deg=7;l.len=4;}
  return notes;
}
function buildSong(def,idx){
  const A=genBars(def.name+'A',def.prog,4,def.sparse,false);
  const A2=A.filter(n=>n.step<32).concat(genBars(def.name+'A2',def.prog,2,def.sparse,true,2));
  const B=genBars(def.name+'B',def.prog,4,def.sparse,false);
  const form=[null,A,A2,B,A2,A,A2,B,A2];const mel={};
  form.forEach((sec,si)=>{if(!sec)return;sec.forEach(n=>{mel[si*64+n.step]=n;});});
  return {def,mel,total:form.length*64,step:0,nextT:0,out:null,sd:60/def.bpm/4,idx};
}

function startSong(i,fade){
  const S=buildSong(SONGS[i],i);S.out=AC.createGain();S.out.connect(musicBus);
  const t=AC.currentTime+.05;S.nextT=t;
  if(fade){S.out.gain.setValueAtTime(0.0001,t);S.out.gain.exponentialRampToValueAtTime(1,t+4);}else S.out.gain.value=1;
  const c=document.getElementById('song');c.style.display='';c.textContent='🎵 '+SONGS[i].name;
  return S;
}
function scheduleSong(S,until){
  const d=S.def;
  while(S.nextT<until&&S.step<S.total){
    const st=S.step,t=S.nextT+((st%2)?d.swing*S.sd:0),bar=Math.floor(st/16),s=st%16;
    const root=d.prog[bar%d.prog.length];
    for(const k in d.drums){const p=d.drums[k];const c=p[s];if(c&&c!=='.'){if(bar<1&&k!=='shaker'&&k!=='hat'&&k!=='guiro'&&k!=='kick')continue;DR[k](t,c,S.out);}}
    const bc=d.bassP[s];
    if(bar>=1&&bc&&bc!=='.'){let m=d.key-24+degSemi(root)+({'0':0,'5':7,'8':12,'3':degSemi(root+2)-degSemi(root)})[bc];if(m<36)m+=12;BASS[d.bass](t,mtof(m),.2,S.out);}

    const n=S.mel[st];
    if(n){const m=d.key+(d.leadOct!=null?d.leadOct:12)-12+degSemi(n.deg);INST[d.lead](t,mtof(m),n.len*S.sd*.92,d.lv,S.out);}
    S.step++;S.nextT+=S.sd;
  }
}
function musicTick(){
  if(!AC||!soundOn)return;const until=AC.currentTime+1.2;
  for(const S of activeSongs)scheduleSong(S,until);
  const cur=activeSongs[activeSongs.length-1];
  if(cur&&!cur.handover&&cur.step>=cur.total-32){cur.handover=true;
    const endT=cur.nextT+32*cur.sd;cur.out.gain.setValueAtTime(1,AC.currentTime+.1);cur.out.gain.exponentialRampToValueAtTime(0.0001,endT);
    songPtr=(songPtr+1)%songOrder.length;activeSongs.push(startSong(songOrder[songPtr],true));}
  activeSongs=activeSongs.filter(S=>S.step<S.total||S.nextT>AC.currentTime);
}

function novoEvento(tipo,nome,fotoUrl){
  const kind=KIND_MAP[String(tipo||'comment').toLowerCase()]||'comment';
  nome=String(nome||'').trim().slice(0,24);if(!nome)return;
  if(kind==='ride'){addRider(nome,fotoUrl,false,/capi|capy/i.test(String(tipo))?'capivara':'rosquinha');return;}
  if(kind==='comment'){if(queue.some(j=>j.name===nome&&j.kind==='comment')||(el.job&&el.job.name===nome&&el.job.kind==='comment'))return;
    // quem ja foi pintado espera 2 minutos para ser pintado de novo por comentario (nao atrasa os outros)
    const lp=lastPainted.get(nome);if(lp&&performance.now()-lp<120000)return;lastPainted.set(nome,performance.now());
    if(queue.filter(j=>j.kind==='comment').length>=30)return;}
  else if(queue.filter(j=>j.name===nome&&j.kind===kind).length>=2)return;
  const job={name:nome,kind,photo:(Array.isArray(fotoUrl)?fotoUrl[0]:fotoUrl)||makeAvatar(nome),ready:false,n:jobN++};
  queue.push(job);renderQueue();
  if(kind==='comment')blip();else{giftSfx(kind);toast(kind==='rose'?`${gi('rosa')} <b>${escapeHtml(nome)}</b> mandou uma rosa!`:`${gi('coracao')} <b>${escapeHtml(nome)}</b> mandou um coração!`,2.2,kind==='rose'?'gold':'pink');}
  const img=new Image();const tries=Array.isArray(fotoUrl)?fotoUrl.slice(1):[];
  img.onload=()=>{job.img=img;fontReady.then(()=>{job.ready=true;});};
  img.onerror=()=>{if(job.photo.startsWith('data:'))return;job.photo=tries.length?tries.shift():makeAvatar(nome);img.src=job.photo;};
  if(job.photo&&!job.photo.startsWith('data:'))img.crossOrigin='anonymous';
  img.src=job.photo;
}

const POIS=[

  {name:'🦓 Campo das Zebras',x:17,z:36,look:[HERD.x,HERD.z],act:'graze'},
  {name:'🦛 Lago dos Hipopótamos',x:POND.x+POND.R+3.5,z:POND.z,look:[POND.x,POND.z],act:'drink'},
  {name:'🦁 Jaula do Leão',x:CAGE.x-CAGE.half-7,z:CAGE.z+4,look:[CAGE.x,CAGE.z+4],act:'greet'},
  {name:'🎨 Paredão das Pinturas',x:0,z:-15,look:[0,WALL_Z],act:'look',rx:30},
  {name:'🌾 Savana',x:0,z:8,look:null,act:'graze',rx:16,rz:8},

const ZONES=POIS.map(p=>({name:p.name,x:p.look?p.look[0]:p.x,z:p.look?p.look[1]:p.z}));
function setPath(path,speed,onDone){el.path=path;el.speed=speed;el.onDone=onDone;el.state='travel';}
function goWander(){

  let tx=p.x+(p.rx?rand(-p.rx,p.rx):0),tz=p.z+(p.rz?rand(-p.rz,p.rz):0);

function resumeWander(){

function startActivity(p){

function bestJobIndex(){let bi=-1;for(let i=0;i<queue.length;i++){const j=queue[i];if(!j.ready)continue;
  if(bi<0||TIER[j.kind]>TIER[queue[bi].kind]||(TIER[j.kind]===TIER[queue[bi].kind]&&j.n<queue[bi].n))bi=i;}return bi;}
function tryPickJob(){

// choose where to paint a comment/rose: nearest baobab face, or the ground right in front
function chooseQuickSpot(big){
  const now=clock.elapsedTime;let best=null,bs=1e9;
  for(const b of baobabs){const d0=Math.hypot(b.x-el.x,b.z-el.z);if(d0>22)continue;
    if(window.__forceGround)break;
    for(const f of b.faces){const sa=f.phi+.5;const sx=b.x+Math.sin(sa)*(BAO_R0+6.2),sz=b.z+Math.cos(sa)*(BAO_R0+6.2);
      if(inZone(sx,sz,.5))continue;const d=Math.hypot(sx-el.x,sz-el.z)+(now-f.usedAt<90?14:0);if(d<bs){bs=d;best={b,f,sx,sz};}}}
  if(best&&bs<20){best.f.usedAt=now;const p=getTreePanel(best.b,best.f,big);return {panel:p,stand:{x:best.sx,z:best.sz}};}
  const tries=[0,.55,-.55,1.1,-1.1,1.7,-1.7,Math.PI];let pick=null;
  for(const a of tries){const yaw=el.yaw+a+rand(-.1,.1);const cx=el.x+Math.sin(yaw)*7.4,cz=el.z+Math.cos(yaw)*7.4;
    if(inZone(cx,cz,2))continue;
    if(groundPanels.some(g=>now-g.usedAt<240&&Math.hypot(g.center.x-cx,g.center.z-cz)<4.6))continue;pick={yaw,cx,cz};break;}
  if(!pick){const yaw=el.yaw;pick={yaw,cx:el.x+Math.sin(yaw)*7.4,cz:el.z+Math.cos(yaw)*7.4};}
  // camera stands behind-right of the elephant; the picture is turned to read upright from there
  const fx=Math.sin(pick.yaw),fz=Math.cos(pick.yaw),rx=-Math.cos(pick.yaw),rz=Math.sin(pick.yaw);
  let side=1;const camOk=sd=>baobabs.every(b=>Math.hypot(el.x-fx*2.5+rx*5.5*sd-b.x,el.z-fz*2.5+rz*5.5*sd-b.z)>8);
  if(!camOk(1)&&camOk(-1))side=-1;
  const camX=el.x-fx*2.5+rx*5.5*side,camZ=el.z-fz*2.5+rz*5.5*side;
  const p=getGroundPanel();p.usedAt=now;placeGroundPanel(p,pick.cx,pick.cz,Math.atan2(pick.cx-camX,pick.cz-camZ),big);
  p.camX=camX;p.camZ=camZ;clearGrass(pick.cx,pick.cz,p.w*.75);
  return {panel:p,stand:{x:el.x,z:el.z},yaw:pick.yaw};
}
function standOf(P){return {x:P.center.x+P.normal.x*P.stand+P.right.x*P.side,z:P.center.z+P.normal.z*P.stand+P.right.z*P.side};}
function startJob(job){

    if(el.panel===cagePanel){
      if(el.inCage)setPath([{x:s.x,z:s.z}],3,arriveAim);
      else setPath(planPath(el.x,el.z,GATE_OUT.x,GATE_OUT.z).concat([{x:CAGE.x-CAGE.half+2,z:CAGE.z},{x:s.x,z:s.z}]),9,arriveAim);
    }else setPath(planPath(el.x,el.z,s.x,s.z),9,arriveAim);

function arriveAim(){

  el.faceYaw=P.kind==='ground'?el.quickYaw:P.kind==='tree'?Math.atan2(P.center.x-el.x,P.center.z-el.z):Math.atan2(-P.normal.x,-P.normal.z);

function finishJob(){

  el.job=null;

    setPath([{x:CAGE.x-CAGE.half+2,z:CAGE.z},{x:GATE_OUT.x,z:GATE_OUT.z}],3.4,()=>{el.inCage=false;if(!tryPickJob())resumeWander();});return;

function moveToward(tx,tz,speed,dt){
  const dx=tx-el.x,dz=tz-el.z,d=Math.hypot(dx,dz);
  if(d<0.4)return true;
  const want=Math.atan2(dx,dz);el.yaw=lerpAngle(el.yaw,want,Math.min(1,dt*3.5));
  if(Math.abs(angDiff(el.yaw,want))<1.0){const st=Math.min(d,speed*dt);el.x+=dx/d*st;el.z+=dz/d*st;el.walk=Math.min(1,el.walk+dt*3);}
  else el.walk=Math.max(.35,el.walk-dt*2);
  el.phase+=dt*(2.2+speed*1.6);
  return false;
}
const sprayTarget=new THREE.Vector3();
function brain(dt,time){
  el.timer-=dt;let tp;const running=el.speed>4;

    if(tryPickJob())return;

  }
  switch(el.state){
    case 'idle':goWander();break;
    case 'travel':{
      const wp=el.path[0];
      if(!wp){const f=el.onDone;el.onDone=null;f&&f();break;}
      if(moveToward(wp.x,wp.z,el.speed,dt)){el.path.shift();if(!el.path.length){const f=el.onDone;el.onDone=null;f&&f();}}

    case 'activity':{
      const a=el.act;a.t+=dt;el.walk=Math.max(0,el.walk-dt*3);el.yaw=lerpAngle(el.yaw,el.faceYaw,Math.min(1,dt*2.5));
      if(a.type==='graze')tp={pitch:.42,base:-.15+Math.sin(time*3)*.12,curl:.04,tip:-.5+Math.sin(time*5)*.2,ear:.1,headYaw:Math.sin(time*.8)*.15};
      else if(a.type==='look')tp={pitch:-.18,base:-.4+Math.sin(time*2)*.2,curl:.12,tip:-.4,ear:.3+Math.sin(time*.5)*.2,headYaw:Math.sin(time*.6)*.25};
      else if(a.type==='greet')tp=a.t<3?{pitch:-.25,base:-2.5,curl:.2,tip:.3,ear:.9,headYaw:0}:{pitch:-.05,base:-.4,curl:.1,tip:-.3,ear:.3,headYaw:Math.sin(time)*.2};
      else if(a.type==='drink'){
        if(a.t<3.2)tp={pitch:.5,base:-.12+Math.sin(time*4)*.05,curl:.02,tip:-.2,ear:.15,headYaw:0};
        else{tp={pitch:-.25,base:-2.9,curl:.24,tip:.2,ear:.6,headYaw:0};
          if(a.t>3.8&&a.t<6.2){E.tip.getWorldPosition(tipV);const bx=-Math.sin(el.yaw),bz=-Math.cos(el.yaw);
            for(let k=0;k<4;k++)emit(tipV.x,tipV.y,tipV.z,bx*rand(1,3)+rand(-1,1),rand(4,7),bz*rand(1,3)+rand(-1,1),2,3,WATER,.45);}}

// ======================================================= ADVENTURES
const ADV_LIST=['snake','butterfly','melon','dance','buck'];
function startAdventure(forced){

  if(riders.length>0&&el.lastAdv!=='buck'&&Math.random()<.3)pool=['buck'];
  const type=forced||pool[(Math.random()*pool.length)|0];el.lastAdv=type;

  if(inZone(el.x+fx*8,el.z+fz*8,1)&&type!=='buck'&&type!=='dance'){el.advT=4;return;}

    snake.dirx=-a.rx;snake.dirz=-a.rz;snake.t=0;scene.add(snake.g);toast('🐍 Opa... o que é aquilo no caminho?',2,'adv');}

}
function endAdventure(){el.adv=null;el.fx.rx=el.fx.rz=el.fx.y=0;if(!tryPickJob())resumeWander();}

        E.tip.getWorldPosition(tipV);for(let k=0;k<90;k++)emit(tipV.x,tipV.y,tipV.z,a.fx*rand(5,10)+rand(-2,2),rand(-1,3),a.fz*rand(5,10)+rand(-2,2),1.5,3,WATER,.45);}

  o.traverse(m=>{if(m.isMesh&&m.material){m.material.metalness=0;m.material.roughness=.85;if(m.material.map){m.material.map.encoding=THREE.LinearEncoding;m.material.map.needsUpdate=true;}m.material.needsUpdate=true;}});
  const bones={};sk.skeleton.bones.forEach(bn=>bones[bn.name]=bn);
  const find=s=>sk.skeleton.bones.find(bn=>bn.name.indexOf(s)===0);
  E.tip=find('proboscis09_end')||find('proboscis09')||E.tip;E.head=find('head1_head')||E.head;
  // height of the back along the body, to seat the riders
  const p=sk.geometry.attributes.position,v=new THREE.Vector3(),back=[];const halfW=(b.max.x-b.min.x)/2;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);sk.boneTransform(i,v);v.applyMatrix4(sk.matrixWorld);E.body.worldToLocal(v);if(Math.abs(v.x)<halfW*.3)back.push([v.z,v.y]);}
  const topAt=z=>{let m=-1;for(const [bz,by] of back)if(Math.abs(bz-z)<.35&&by>m)m=by;return m;};
  // find the highest back point behind the head (the shoulders) and lay seats backwards from there
  let zs=[];for(let z=b.min.z+.6;z<b.max.z-1.6;z+=.1)zs.push([z,topAt(z)]);
  zs=zs.filter(a=>a[1]>0);const top=zs.reduce((a,c)=>c[1]>a[1]?c:a,zs[0]);
  const len=b.max.z-b.min.z;const seatZ=[top[0]-.05,top[0]-len*.16,top[0]-len*.3,top[0]-len*.42];
  SEATS.length=0;seatZ.forEach(z=>SEATS.push(z));
  const backTop={};seatZ.forEach(z=>backTop[z]=topAt(z));
  seatY=z=>(backTop[z]!=null?backTop[z]:topAt(z))-.02;
  const spine=find('spine1_hiResSpine3')||find('spine1_hiResSpine2')||sk.skeleton.bones[1];
  const saddle=new THREE.Object3D();E.body.add(saddle);E.root.updateMatrixWorld(true);spine.attach(saddle);
  // saddle blanket
  const midZ=(seatZ[0]+seatZ[3])/2,blen=Math.abs(seatZ[0]-seatZ[3])+1.2,yTop=topAt(midZ);
  let tw=0;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);sk.boneTransform(i,v);v.applyMatrix4(sk.matrixWorld);E.body.worldToLocal(v);if(Math.abs(v.z-midZ)<.4&&v.y>yTop*.7)tw=Math.max(tw,Math.abs(v.x));}
  const r=Math.max(.6,tw*.95);
  const bl=new THREE.Mesh(new THREE.CylinderGeometry(r,r,blen,24,1,true,-1.05,2.1),new THREE.MeshStandardMaterial({map:blanketTex(),roughness:.85,side:THREE.DoubleSide}));
  bl.rotation.x=Math.PI/2;bl.rotation.y=Math.PI;bl.position.set(0,yTop-r+.06,midZ);bl.castShadow=true;
  bl.geometry.dispose();
  riders.forEach((rd,i)=>{saddle.add(rd.g);rd.seat=seatFor(i);});
  E.riderParent=saddle;

}
function setClip(name,opt={}){
  const M=MODEL.el;if(!M)return;const a=M.actions[name];if(!a)return;
  const key=name+(opt.freeze!=null?'@'+opt.freeze:'');
  if(M.cur===key){if(opt.ts!=null&&opt.freeze==null)a.setEffectiveTimeScale(opt.ts);return;}
  const prev=M.curAction;
  a.reset();a.enabled=true;a.setLoop(opt.once?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=!!opt.once;
  if(opt.freeze!=null){a.time=opt.freeze*a.getClip().duration;a.setEffectiveTimeScale(0);}
  else a.setEffectiveTimeScale(opt.ts!=null?opt.ts:1);
  if(opt.from!=null)a.time=opt.from*a.getClip().duration;
  a.setEffectiveWeight(1);a.play();
  if(prev&&prev!==a)prev.crossFadeTo(a,opt.fade||.3,false);
  M.cur=key;M.curAction=a;
}
function animateElephantModel(dt,time){
  const M=MODEL.el;const s=el.state,a=el.act,adv=el.adv;
  E.root.position.set(el.x,groundH(el.x,el.z),el.z);E.root.rotation.y=el.yaw;
  E.body.position.y=el.hop+el.fx.y;E.body.rotation.z=el.fx.rz;E.body.rotation.x=el.fx.rx;
  if(s==='travel'){if(el.walk<.2)setClip('idle');else if(el.speed>4)setClip('run',{ts:el.speed/7.5});else setClip('walk',{ts:el.speed/2.3});}
  else if(s==='activity'&&a){
    if(a.type==='graze')setClip('eating');
    else if(a.type==='look')setClip('idle');
    else if(a.type==='greet')setClip(a.t<3?'drop':'idle');
    else if(a.type==='drink')setClip(a.t<3.2?'eating':'idle trumpet');
  }
  else if(s==='aim'||s==='spray'){const P=el.panel;if(P&&P.kind==='ground')setClip('idle trumpet',{freeze:.5});else setClip('idle Trumped',{freeze:.25});}
  else if(s==='proud'){const big=el.panel&&(el.panel.kind==='giant'||el.panel.kind==='cage'||(el.job&&el.job.kind==='rose'));setClip(big?'drop':'idle');}
  else if(s==='adv'&&adv){const t=adv.t;
    if(adv.type==='snake'){if(t<.9)setClip('idle');else if(t<2.6)setClip('fight idle',{from:.3,once:true,fade:.15});else if(t<4.4)setClip('walk',{ts:-.9});else setClip('idle');}
    else if(adv.type==='buck')setClip('fight',{ts:1.2});
    else if(adv.type==='dance')setClip('drop',{ts:1.6});
    else if(adv.type==='butterfly'){if(t<4.4)setClip('idle Trumped',{ts:.6});else if(t<5.4)setClip('hit front',{once:true,fade:.1});else setClip('idle');}
    else if(adv.type==='melon'){if(adv.stage===0)setClip('walk',{ts:1});else if(adv.stage===1)setClip('pick');else if(adv.stage===2)setClip('pick');else setClip('eating');}
  }
  else setClip('idle');
  M.mixer.update(dt);
}
function setupLionModel(g){
  const o=g.scene;o.updateMatrixWorld(true);const meshes=[];o.traverse(m=>{if(m.isMesh)meshes.push(m);});
  const geos=meshes.map(m=>{const ge=m.geometry.clone();ge.applyMatrix4(m.matrixWorld);return {ge,m};});
  const b=new THREE.Box3();geos.forEach(x=>{x.ge.computeBoundingBox();b.union(x.ge.boundingBox);});
  const k=3.6/(b.max.y-b.min.y);const T=new THREE.Matrix4().makeScale(k,k,k).multiply(new THREE.Matrix4().makeTranslation(-(b.min.x+b.max.x)/2,-b.min.y,-(b.min.z+b.max.z)/2));
  geos.forEach(x=>x.ge.applyMatrix4(T));
  const bb=new THREE.Box3();geos.forEach(x=>{x.ge.computeBoundingBox();bb.union(x.ge.boundingBox);});
  const L=bb.max.z-bb.min.z,Hh=bb.max.y;
  // the mane piece tells where the head is
  let mane=geos.reduce((a,x)=>x.ge.attributes.position.count<a.ge.attributes.position.count&&x.ge.attributes.position.count>500?x:a,geos[0]);
  geos.forEach(x=>{if(x!==geos[0]&&x.ge.attributes.position.count>500&&x.ge.attributes.position.count<5000)mane=x;});
  mane.ge.computeBoundingBox();const mb=mane.ge.boundingBox;
  const pivot=new THREE.Vector3(0,mb.min.y+(mb.max.y-mb.min.y)*.25,mb.min.z+.1);
  const tailBase=new THREE.Vector3(0,Hh*.5,bb.min.z+L*.2);
  const U={uHeadQ:{value:new THREE.Vector4(0,0,0,1)},uPivot:{value:pivot},uTailQ:{value:new THREE.Vector4(0,0,0,1)},uTailP:{value:tailBase}};
  const mat=meshes[0].material.clone();if(mat.map){mat.map.encoding=THREE.LinearEncoding;mat.map.needsUpdate=true;}
  mat.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);
    sh.vertexShader='attribute float hw;attribute float tw;\nuniform vec4 uHeadQ;uniform vec3 uPivot;uniform vec4 uTailQ;uniform vec3 uTailP;\nvec3 qrot(vec4 q,vec3 v){return v+2.0*cross(q.xyz,cross(q.xyz,v)+q.w*v);}\n'+sh.vertexShader
      .replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\nobjectNormal=normalize(mix(mix(objectNormal,qrot(uHeadQ,objectNormal),hw),qrot(uTailQ,objectNormal),tw));')
      .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed=mix(transformed,uPivot+qrot(uHeadQ,transformed-uPivot),hw);\ntransformed=mix(transformed,uTailP+qrot(uTailQ,transformed-uTailP),tw);');};
  const grp=new THREE.Group();
  geos.forEach(({ge,m})=>{const p=ge.attributes.position,n=p.count,hw=new Float32Array(n),tw=new Float32Array(n);
    const whole=ge!==geos[0].ge&&!(m===meshes[0]);
    for(let i=0;i<n;i++){const y=p.getY(i),z=p.getZ(i);
      hw[i]=whole&&ge===mane.ge?1:smooth(pivot.z-.35,pivot.z+.45,z)*smooth(pivot.y-1.1,pivot.y-.3,y);
      if(whole&&ge!==mane.ge&&z>pivot.z-.2)hw[i]=1;
      tw[i]=ge===mane.ge?0:smooth(tailBase.z+.15,tailBase.z-.5,z)*smooth(Hh*.25,Hh*.42,y);}
    ge.setAttribute('hw',new THREE.BufferAttribute(hw,1));ge.setAttribute('tw',new THREE.BufferAttribute(tw,1));
    const me=new THREE.Mesh(ge,mat);me.castShadow=true;me.receiveShadow=true;grp.add(me);});
  lion.root.children.forEach(c=>c.visible=false);lion.root.add(grp);
  MODEL.lion={U,grp,q:new THREE.Quaternion(),e:new THREE.Euler(0,0,0,'YXZ')};
}
// ---------- giraffes and zebras from the user's models
function prepAnimal(g,height){
  // measure once in idle pose
  const tmp=THREE.SkeletonUtils.clone(g.scene);const box=new THREE.Box3();tmp.updateMatrixWorld(true);
  let found=false;tmp.traverse(m=>{if(m.isSkinnedMesh){found=true;const b=skinnedBox(m,null);box.union(b);}});
  if(!found)box.setFromObject(tmp);
  const k=height/(box.max.y-box.min.y);
  return {g,k,off:new THREE.Vector3(-(box.min.x+box.max.x)/2,-box.min.y,-(box.min.z+box.max.z)/2)};
}
function animalInstance(P,a,scale){
  const o=THREE.SkeletonUtils.clone(P.g.scene);
  o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.frustumCulled=false;if(m.material){m.material=m.material.clone();m.material.metalness=0;
    if(m.material.map){m.material.map.encoding=THREE.LinearEncoding;}m.material.needsUpdate=true;}}});
  const holder=new THREE.Group();holder.add(o);holder.scale.setScalar(P.k*scale);holder.position.copy(P.off).multiplyScalar(P.k*scale);
  a.root.children.forEach(c=>c.visible=false);a.root.add(holder);
  const mixer=new THREE.AnimationMixer(o);const acts={};P.g.animations.forEach(c=>acts[c.name]=mixer.clipAction(c));
  const bones={};o.traverse(n=>{if(n.isBone)bones[n.name]=n;});
  a.M={mixer,acts,cur:null,bones,phase:Math.random()*10};
}
function animalClip(a,name,opt={}){
  const M=a.M;const act=M.acts[name];if(!act||M.cur===name){if(act&&opt.ts!=null)act.setEffectiveTimeScale(opt.ts);return;}
  const prev=M.cur&&M.acts[M.cur];act.reset();act.setLoop(opt.once?THREE.LoopOnce:THREE.LoopRepeat);act.clampWhenFinished=!!opt.once;
  act.setEffectiveTimeScale(opt.ts||1);act.setEffectiveWeight(1);act.play();
  if(!prev)act.time=Math.random()*act.getClip().duration;
  if(prev)prev.crossFadeTo(act,.5,false);M.cur=name;
}
function setupGiraffeModel(g){const P=prepAnimal(g,8.6);giraffes.forEach(a=>animalInstance(P,a,a.root.scale.x));MODEL.giraffe=true;}
function setupZebraModel(g){const P=prepAnimal(g,3.2);zebras.forEach(a=>animalInstance(P,a,a.root.scale.x));MODEL.zebra=true;}
function animateAnimalModels(dt,time){
  if(MODEL.giraffe)giraffes.forEach(a=>{if(!a.M)return;
    if(a.eating)animalClip(a,'Anim_GiraffeEatStart',{once:true});
    else animalClip(a,a.walk>.3?'Anim_GiraffeWalkForward':'Anim_GiraffeIdle',{ts:.8});
    a.M.mixer.update(dt);});
  if(MODEL.zebra)zebras.forEach(z=>{if(!z.M)return;
    animalClip(z,z.walk>.3?'Armature|Armature|WalkSlow':'Armature|Armature|Idle',{ts:z.walk>.3?1.1:1});
    z.M.mixer.update(dt);
    // grazing: bend the neck down to the grass
    z.M.graze=lerp(z.M.graze||0,z.graze&&z.walk<.3?1:0,Math.min(1,dt*2));
    const gz=z.M.graze;if(gz>.01){const b=z.M.bones;const w=Math.sin(time*3+z.M.phase)*.06;
      if(b.Shoulders)b.Shoulders.rotation.x+=.75*gz;if(b.Neck)b.Neck.rotation.x+=(.85+w)*gz;if(b.Head)b.Head.rotation.x+=.3*gz;}});
}

function loadModels(){
  if(!THREE.GLTFLoader)return;const Ld=new THREE.GLTFLoader();
  // in the app the .glb files sit next to the game; on the web page they come packed inside .js files
  const get=(name,cb)=>{const ok=g=>{try{cb(g);}catch(e){console.error(name,e);}};
    if(window.APP_MODE){Ld.load(MODEL_BASE+name+'.glb',ok,undefined,e=>console.warn(name,e));return;}
    const sc=document.createElement('script');sc.src=MODEL_BASE+name+'.js';
    sc.onload=()=>{try{const s=atob(window.__GLB[name]);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);delete window.__GLB[name];Ld.parse(u.buffer,'',ok,e=>console.warn(name,e));}catch(e){console.warn(name,e);}};
    document.head.appendChild(sc);};
  get('elefante',setupElephantModel);get('leao',setupLionModel);
  if(THREE.SkeletonUtils){get('girafa',setupGiraffeModel);get('zebra',setupZebraModel);}
}

// ======================================================= CAMERA
const camPos=new THREE.Vector3(6,9,26),camLook=new THREE.Vector3(0,3,0),wantPos=new THREE.Vector3(),wantLook=new THREE.Vector3();
let camYaw=Math.PI,camSide=1,camSideT=25;
function camBlocked(cx,cz){
  for(const b of baobabs){const dx=el.x-cx,dz=el.z-cz,L2=dx*dx+dz*dz||1;let t=((b.x-cx)*dx+(b.z-cz)*dz)/L2;t=clamp(t,0,1);
    if(Math.hypot(cx+dx*t-b.x,cz+dz*t-b.z)<BAO_R0+1.2)return true;}
  return false;}
function updateCamera(dt,time){
  if(window.__cam){const c=window.__cam;camera.position.set(c[0],c[1],c[2]);camera.lookAt(c[3],c[4],c[5]);return;}
  const portrait=innerHeight>innerWidth;let k=1-Math.exp(-dt*1.6);
  const P=el.panel;const painting=el.job&&(el.state==='aim'||el.state==='spray'||el.state==='proud');
  if(painting&&P.cam){
    const c=P.cam;
    wantLook.copy(P.center).addScaledVector(P.normal,c.look);wantLook.y=P.center.y+c.lookDy;
    wantPos.copy(P.center).addScaledVector(P.normal,portrait?c.d:c.d*.82).addScaledVector(P.right,c.side);wantPos.y=P.center.y+c.dy;
  }else if(painting&&P.kind==='tree'){
    k=1-Math.exp(-dt*2.4);
    const ca=P.face.phi-.85,cd=BAO_R0+(portrait?14:12);
    wantLook.copy(P.center).addScaledVector(P.normal,1.6);wantLook.y=P.center.y-.4;
    wantPos.set(P.b.x+Math.sin(ca)*cd,P.center.y+3.4,P.b.z+Math.cos(ca)*cd);
  }else if(painting&&P.kind==='ground'){
    k=1-Math.exp(-dt*2.4);
    wantLook.copy(P.center).addScaledVector(P.up,.4);
    wantPos.set(P.camX,P.center.y+(portrait?11:9.5),P.camZ);
  }else{
    camSideT-=dt;if(camSideT<0){camSideT=rand(18,30);camSide=-camSide;}
    let target;
    if(el.state==='activity'||el.state==='adv')target=el.yaw+camSide*(.85+Math.sin(time*.15)*.3);
    else target=el.yaw+camSide*(1.9+Math.sin(time*.12)*.5);
    const dist=(portrait?16:14)+(el.speed>4&&el.state==='travel'?3:0)+(riders.length>4?3:0);
    // avoid baobab trunks between the camera and the elephant
    for(const off of [0,.5,-.5,1,-1,1.6,-1.6,2.3,-2.3,Math.PI]){const ty=target+off;
      if(!camBlocked(el.x+Math.sin(ty)*dist,el.z+Math.cos(ty)*dist)){target=ty;break;}}
    const blockedNow=camBlocked(el.x+Math.sin(camYaw)*dist,el.z+Math.cos(camYaw)*dist);
    camYaw=lerpAngle(camYaw,target,Math.min(1,dt*(blockedNow?2.5:.7)));
    wantLook.set(el.x+Math.sin(el.yaw)*1.5,3+(riders.length?1:0),el.z+Math.cos(el.yaw)*1.5);
    let cx=el.x+Math.sin(camYaw)*dist,cz=el.z+Math.cos(camYaw)*dist;
    if(cz<WALL_Z+4)cz=WALL_Z+4;
    if(el.inCage)cx=Math.min(cx,CAGE.x-CAGE.half-3);
    wantPos.set(cx,7+Math.sin(time*.13)*.8+(el.inCage?2:0)+(riders.length>4?2:0),cz);
  }
  camPos.lerp(wantPos,k);camLook.lerp(wantLook,k);
  const gy=groundH(camPos.x,camPos.z)+2;if(camPos.y<gy)camPos.y=gy;
  // don't let the camera sit inside a baobab trunk
  for(const b of baobabs){const dx=camPos.x-b.x,dz=camPos.z-b.z,d=Math.hypot(dx,dz);if(d<BAO_R0+1&&camPos.y<BAO_H+2){camPos.x=b.x+dx/d*(BAO_R0+1);camPos.z=b.z+dz/d*(BAO_R0+1);}}
  camera.position.copy(camPos);camera.lookAt(camLook);
  sunLight.position.set(el.x-30,55,el.z+22);sunLight.target.position.set(el.x,0,el.z-4);
}
const whereEl=document.getElementById('where');let whereT=0;
function updateWhere(dt){whereT-=dt;if(whereT>0)return;whereT=.5;
  let best=null,bd=1e9;for(const z of ZONES){const d=Math.hypot(el.x-z.x,el.z-z.z);if(d<bd){bd=d;best=z;}}
  let name=bd<26?best.name:'🌾 Savana';
  if(baobabs.some(b=>Math.hypot(el.x-b.x,el.z-b.z)<12)&&bd>=18)name='🌳 Baobá';
  if(whereEl.textContent!=='📍 '+name)whereEl.textContent='📍 '+name;}

const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
  brain(dt,time);animateElephant(dt,time);animateRiders(dt,time);animateProps(dt,time);animateAnimals(dt,time);animateAnimalModels(dt,time);updateParticles(dt);
  revealing.forEach(p=>updateReveal(p,dt));updateDrying(dt);
  updateStream(dt,el.state==='spray'&&el.job,el.job&&el.job.kind,el.state==='spray'?sprayTarget:null);
  clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>260)c.position.x=-260;});
  birds.forEach(b=>{const u=b.userData;const a=time*u.sp+u.ph;b.position.set(u.cx+Math.cos(a)*u.rad,u.h+Math.sin(time*.5+u.ph)*2,u.cz+Math.sin(a)*u.rad);
    b.rotation.y=-a+(u.sp>0?0:Math.PI);const f=Math.sin(time*9+u.ph)*.6;u.l.rotation.z=f;u.r.rotation.z=-f;});
  POND_N.offset.set(time*.02,time*.013);
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('show');}
  updateWhere(dt);updateCamera(dt,time);updateLegends(dt,time);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
